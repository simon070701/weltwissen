<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Spind 14</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f8; --paper:#ffffff; --ink:#14213d; --muted:#5d6b85; --line:#d8e0ee;
    --navy:#16346b; --court:#2457a8; --lime:#c9de3a; --lime2:#b3c82a; --coral:#d4553f; --glass:#7fb7c9;
    --yel:#e3c51b; --blu:#2f6fd6;
    --head:"Outfit", system-ui, sans-serif; --sans:"Inter", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans); font-size:18px; line-height:1.55; color:var(--ink); background:var(--bg); min-height:100vh}
  .wrap{max-width:680px; margin:0 auto; padding:22px 18px 70px}
  h1{font-family:var(--head); font-weight:800; font-size:2.2rem; line-height:1.1; margin:.2em 0 .4em; letter-spacing:-.01em}
  h2{font-family:var(--head); font-weight:700; font-size:1.3rem; margin:.2em 0 .4em}
  .eyebrow{font-family:var(--head); font-size:.8rem; letter-spacing:.18em; text-transform:uppercase; color:var(--court); font-weight:700}
  p{margin:.5em 0 .9em}
  .card{background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:20px 18px; box-shadow:0 10px 30px rgba(20,33,61,.07); margin-top:16px}
  .muted{color:var(--muted)}
  button{font:inherit; font-weight:700; cursor:pointer; border-radius:12px; border:0; padding:15px 20px; min-height:54px; transition:transform .1s, background .2s}
  button:active{transform:translateY(1px)}
  .primary{background:var(--navy); color:#fff; width:100%; font-size:1.08rem; font-family:var(--head); letter-spacing:.02em}
  .primary:hover{background:var(--court)}
  .ghost{background:#e6ecf6; color:var(--ink)}
  .link{background:none; color:var(--court); padding:8px 0; min-height:0; text-decoration:underline; text-underline-offset:4px}
  .choice{display:flex; align-items:center; gap:16px; width:100%; text-align:left; background:var(--paper); border:2px solid var(--line); margin-top:12px; padding:16px}
  .choice:hover{border-color:var(--court)}
  .choice .num{flex:none; width:50px; height:50px; border-radius:50%; background:var(--navy); color:#fff; display:grid; place-items:center; font-family:var(--head); font-size:1.5rem; font-weight:800}
  .choice .num.q{background:var(--lime); color:var(--ink)}
  .choice small{display:block; color:var(--muted); font-weight:500}
  .feedback{min-height:1.4em; font-weight:700; color:var(--coral); margin:12px 0 0}
  .shake{animation:shake .45s}
  @keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  input[type=text]{width:100%; font:inherit; font-family:var(--head); font-size:1.4rem; letter-spacing:.12em; text-transform:uppercase; text-align:center; color:var(--ink); background:#fff; border:2px solid var(--line); border-radius:12px; padding:13px; outline:none; margin-bottom:12px}
  input[type=text]:focus{border-color:var(--court)}
  .locker{display:grid; place-items:center; margin:4px 0 8px}
  .locker svg{width:130px; height:170px}

  /* Anzeigetafel */
  .task{border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:14px; background:#f8fafd}
  .task h2{display:flex; justify-content:space-between; align-items:center; font-size:1.05rem}
  .serve{font-size:.85rem; font-weight:700; padding:3px 10px; border-radius:20px}
  .serve.G{background:#fbf1b4; color:#6b5a00} .serve.B{background:#d9e6fb; color:#163d84}
  .balls{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 12px}
  .ball{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:.85rem; color:#fff; font-family:var(--head); position:relative}
  .ball.G{background:var(--yel); color:#4a3d00} .ball.B{background:var(--blu)}
  .ball::after{content:""; position:absolute; inset:5px; border-radius:50%; border:1.5px solid rgba(255,255,255,.55); border-left-color:transparent; border-right-color:transparent}
  .call{display:flex; align-items:center; gap:10px; font-family:var(--head)}
  .call label{font-size:.75rem; color:var(--muted); display:block; text-transform:uppercase; letter-spacing:.08em; font-weight:700}
  .call select{font:inherit; font-family:var(--head); font-size:1.25rem; font-weight:700; padding:10px 8px; border-radius:10px; border:2px solid var(--line); background:#fff; color:var(--ink); min-width:120px}
  .call .colon{font-size:1.6rem; font-weight:800; padding-top:18px}
  .task.ok{border-color:#9cc56a; background:#f2f8e8}
  .reveal{margin-top:18px; padding:18px; border-radius:16px; background:#f3f8dc; border:2px solid #d4e48a; animation:rise .6s ease both}
  .reveal svg{width:100%; height:auto; display:block; margin:8px 0 12px}
  @keyframes rise{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}

  .hintenv{border-top:1px solid var(--line); padding:14px 0}
  .hintenv:first-of-type{border-top:0}
  .hintenv h2{display:flex; align-items:center; gap:12px; margin:0 0 6px}
  .hintenv h2 span{display:grid; place-items:center; width:38px; height:38px; border-radius:50%; background:var(--navy); color:#fff; font-size:1.05rem; flex:none}
  .hint{margin:10px 0; padding:12px 14px; border-left:5px solid var(--court); background:#e9f0fb; border-radius:0 12px 12px 0}
  .hint.sol{border-color:var(--coral); background:#fbe9e5}
  .hintenv .ghost{padding:10px 16px; min-height:44px; font-size:.95rem}

  .gift .big{font-family:var(--head); font-size:clamp(1.8rem,8.2vw,3.2rem); font-weight:800; color:var(--navy); text-align:center; line-height:1; margin:.15em 0 .15em; letter-spacing:.02em}
  .gift .sub{text-align:center; color:var(--muted); margin-bottom:1em}
  .gift .plus{margin:14px 0; padding:16px 18px; border-radius:14px; background:var(--lime); color:var(--ink); font-family:var(--head); font-size:1.15rem; font-weight:700; text-align:center}
  .gift ul{padding-left:1.1em} .gift li{margin:.35em 0}
  .gift .sig{font-family:var(--head); font-size:1.2rem; margin-top:1em; font-weight:600}
  nav.top{display:flex; justify-content:space-between; align-items:center}
  .confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:5}
  .confetti i{position:absolute; top:-20px; width:12px; height:12px; border-radius:50%; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}
</style>
</head>

<div class="wrap" id="app"></div>
<div class="confetti" id="confetti"></div>

const HINTS=[{"n":1,"title":"Spind 14","last":true,"hints":["Heb das Protokoll gut auf – lösen kannst du es erst mit den anderen Umschlägen.","Jeder der 14 Spielstände steht für genau einen Buchstaben.","Bau ein 5 × 5-Feld wie im Beispiel aus Umschlag 4, aber mit dem Wort aus Umschlag 2. Die erste Zahl eines Spielstands nennt die Zeile (Aufschläger), die zweite die Spalte (Rückschläger). Einstand heißt 40 : 40.","Das Code-Wort lautet <b>PADELSCHLÄGER</b>.<br>Feld: V I B O R · A C D E F · G H K L M · N P Q S T · U W X Y Z"]},{"n":2,"title":"Die Rangliste","last":true,"hints":["Leg dir eine Tabelle an: Platz 1 bis 6, darunter Name, Lieblingsschlag und Schlägerfarbe.","Starte mit den festen Punkten: Wo landet die Bajada? Wer steht direkt vor wem? Und was folgt daraus für die Farben?","Platz 1 belegt Vera, Platz 6 Anton.","1 Vera · Remate · Schwarz<br>2 Ingo · Globo · Weiß<br>3 Bernd · Bandeja · Rot<br>4 Olga · Volley · Gelb<br>5 Rita · Chiquita · Blau<br>6 Anton · Bajada · Grün<br>Die Anfangsbuchstaben ergeben <b>VIBORA</b>."]},{"n":3,"title":"Die Anzeigetafel","last":true,"hints":["Gezählt wird 0 – 15 – 30 – 40. Wer bei 40 den nächsten Punkt macht, gewinnt das Spiel – außer es steht 40 : 40.","Bei 40 : 40 heißt es Einstand. Wer danach punktet, hat Vorteil. Verliert er den nächsten Punkt, ist wieder Einstand.","Zähl für jedes Spiel erst die Punkte beider Teams. Dann nennst du den Stand des aufschlagenden Teams zuerst.","Spiel 1: 40 : 15 · Spiel 2: 30 : 40 · Spiel 3: 40 : Vorteil · Spiel 4: 40 : 40"]},{"n":4,"title":"Das Beispiel","last":true,"hints":["Vergleiche das Beispielfeld mit dem gewohnten Alphabet.","Zuerst steht das Beispielwort – jeder Buchstabe nur einmal. Danach folgt der Rest des Alphabets der Reihe nach.","Ein Buchstabe fehlt im Feld ganz: das J. Jetzt bau dasselbe mit deinem Wort aus Umschlag 2.","Mit VIBORA: V I B O R · A C D E F · G H K L M · N P Q S T · U W X Y Z"]},{"n":5,"title":"Der letzte Ballwechsel","last":false,"hints":["Hier gibt es nichts mehr zu entschlüsseln – nur noch anzuwenden. Und ein Tipp: Das Wort beginnt mit PADEL."]}];

const TEAM={G:"Gelb",B:"Blau"};

function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h||1;}
function stream(k,n){let s=hash("mama:"+k);const o=new Uint8Array(n);for(let i=0;i<n;i++){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;o[i]=s&255;}return o;}
function decrypt(b64,key){
  const bin=atob(b64), ks=stream(key,bin.length), out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i)^ks[i];
  let t; try{t=new TextDecoder("utf-8",{fatal:true}).decode(out);}catch(e){return null;}
  return t.startsWith("OK|")?JSON.parse(t.slice(3)):null;
}
function unlock(blobs,key){for(const b of blobs){const r=decrypt(b,key); if(r) return r;} return null;}
const letters=s=>s.toUpperCase().replace(/Ä/g,"AE").replace(/Ö/g,"OE").replace(/Ü/g,"UE").replace(/ß/g,"SS").replace(/[^A-Z]/g,"");

const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}};

/* ---------------- Spind ---------------- */

    <g transform="translate(65 86) rotate(-18)"><ellipse cx="0" cy="-22" rx="24" ry="30" fill="#c9de3a" stroke="#14213d" stroke-width="3"/>

    <rect x="-5" y="6" width="10" height="34" rx="4" fill="#14213d"/></g>`:

</svg>`;
const WRONG=["Der Spind bleibt zu.","Klick. Nichts passiert.","Falscher Code – vielleicht fehlt dir noch ein Umschlag?","Das Schloss rührt sich nicht."];
let wrongN=0;
function spind(){
  if(state.spind){ const g=unlock(DATA.spind,state.spind); if(g) return gift(g,false); }
  app.innerHTML=`${topNav()}
  <div class="eyebrow">Umschlag 1</div>
  <h1>Spind 14</h1>
  <div class="locker">${lockerSVG(false)}</div>
  <p>In diesem Spind wartet etwas auf dich. Sein Schloss öffnet sich mit einem Wort – und das Wort steckt im Protokoll der Schiedsrichterin.</p>
  <div class="card">
    <form id="f" autocomplete="off">
      <input type="text" id="pw" placeholder="Code-Wort" aria-label="Code-Wort" maxlength="24" autocapitalize="characters" spellcheck="false">
      <button class="primary">Spind öffnen</button>
    </form>
    <p class="feedback" id="fb" role="status"></p>
  </div>
  <p class="muted" style="margin-top:16px">Du kannst jederzeit wiederkommen: einfach den Code aus Umschlag 1 noch einmal scannen.</p>`;
  $("#f").onsubmit=e=>{
    e.preventDefault();
    const L=letters($("#pw").value);
    const g=L?unlock(DATA.spind,L.toLowerCase()):null;
    if(g){state.spind=L.toLowerCase(); save(); gift(g,true);}
    else{shake($(".card")); $("#fb").textContent=L?WRONG[wrongN++%WRONG.length]:"Bitte gib zuerst ein Code-Wort ein.";}
  };
}
function gift(g,fresh){
  app.innerHTML=`${topNav()}<div class="locker">${lockerSVG(true)}</div><div class="card gift">${g.html}</div>`;
  if(fresh){burst(170); window.scrollTo(0,0);}
}

/* ---------------- Anzeigetafel ---------------- */
let picks=TASKS.map(()=>["",""]);
function tafel(){
  const solved=state.tafel?unlock(DATA.tafel,state.tafel):null;
  if(solved) picks=state.tafel.split("|").map(x=>x.split("-").map(v=>v==="v"?"Vorteil":v));
  app.innerHTML=`${topNav()}
  <div class="eyebrow">Umschlag 3</div>
  <h1>Die Anzeigetafel</h1>
  <p>Bevor du spielst, musst du zählen können. Hier wird <b>mit Vorteil</b> gespielt – ohne Golden Point. Die Ansage macht immer das aufschlagende Team, und zwar mit dem <b>eigenen Stand zuerst</b>.</p>
  <p>Jede Kugel ist ein Punkt für das Team in dieser Farbe. Wie lautet die Ansage nach dem letzten Punkt?</p>
  <div id="tasks"></div>
  ${solved?"":`<button class="primary" id="chk" style="margin-top:18px">Ansagen prüfen</button><p class="feedback" id="fb" role="status"></p>`}
  <div id="rev"></div>`;
  $("#tasks").innerHTML=TASKS.map((t,i)=>`
    <div class="task ${solved?"ok":""}" id="t${i}">
      <h2>Spiel ${i+1}<span class="serve ${t.srv}">Aufschlag: ${TEAM[t.srv]}</span></h2>
      <div class="balls">${[...t.seq].map(x=>`<span class="ball ${x}" title="Punkt ${TEAM[x]}">${x}</span>`).join("")}</div>
      <div class="call">
        <div><label>${TEAM[t.srv]} (Aufschlag)</label><select data-i="${i}" data-s="0" ${solved?"disabled":""}><option value="">–</option>${OPTS.map(o=>`<option ${picks[i][0]===o?"selected":""}>${o}</option>`).join("")}</select></div>
        <span class="colon">:</span>
        <div><label>${TEAM[t.srv==="G"?"B":"G"]} (Rückschlag)</label><select data-i="${i}" data-s="1" ${solved?"disabled":""}><option value="">–</option>${OPTS.map(o=>`<option ${picks[i][1]===o?"selected":""}>${o}</option>`).join("")}</select></div>
      </div>
    </div>`).join("");
  if(solved){ showTafel(solved,false); return; }
  document.querySelectorAll("#tasks select").forEach(s=>s.onchange=()=>{picks[+s.dataset.i][+s.dataset.s]=s.value;});
  $("#chk").onclick=()=>{
    if(picks.some(p=>!p[0]||!p[1])){ $("#fb").textContent="Es fehlen noch Ansagen."; return; }
    const parts=picks.map(p=>p.map(v=>v==="Vorteil"?"v":v).join("-"));
    const r=unlock(DATA.tafel,parts.join("|"));
    if(r){state.tafel=parts.join("|"); save(); $("#chk").remove(); $("#fb").remove();
      document.querySelectorAll("#tasks select").forEach(s=>s.disabled=true);
      document.querySelectorAll(".task").forEach(t=>t.classList.add("ok")); showTafel(r,true);}
    else{
      const n=parts.filter((x,i)=>hash("tafel"+i+":"+x)===TASKS[i].h).length;
      shake($("#tasks")); $("#fb").textContent=`${n} von ${TASKS.length} Ansagen stimmen.`;
    }
  };
}
function showTafel(r,fresh){ $("#rev").innerHTML=`<div class="reveal">${r.html}</div>`; if(fresh) burst(60); }

function renderHints(){
  $("#hl").innerHTML=HINTS.map((env,k)=>{
    const n=state.hints[k]||0;
    const shown=env.hints.slice(0,n).map((h,j)=>`<div class="hint ${j===env.hints.length-1&&env.last?"sol":""}">${h}</div>`).join("");
    let btn="";
    if(n<env.hints.length){
      const isLast=n===env.hints.length-1&&env.last;
      btn=`<button class="ghost" data-k="${k}" data-last="${isLast?1:0}">${isLast?"Lösung zeigen":"Hinweis "+(n+1)+" zeigen"}</button>`;
    }
    return `<div class="hintenv"><h2><span>${env.n}</span>${env.title}</h2>${shown}${btn}</div>`;
  }).join("");
  document.querySelectorAll("#hl button").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;
    if(b.dataset.last==="1" && !b.dataset.armed){ b.dataset.armed="1"; b.textContent="Wirklich? Dann nochmal tippen."; return; }
    state.hints[k]=(state.hints[k]||0)+1; save(); renderHints();
  });
}

function burst(n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box=$("#confetti"), cols=["#c9de3a","#e3c51b","#2457a8","#16346b","#7fb7c9"];
  for(let i=0;i<n;i++){const e=document.createElement("i"); e.style.left=Math.random()*100+"vw"; e.style.background=cols[i%5];
    e.style.animationDuration=(2+Math.random()*2.4)+"s"; e.style.animationDelay=Math.random()*.6+"s"; box.appendChild(e); setTimeout(()=>e.remove(),5500);}
}
function route(){
  const h=location.hash.slice(1);
  if(h==="spind") spind(); else if(h==="tafel") tafel(); else if(h==="hilfe") hilfe(); else home();
}
window.addEventListener("hashchange",()=>{route(); window.scrollTo(0,0);});
route();
</script>
